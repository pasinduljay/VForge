global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vforge-api
    metrics_path: /metrics
    # Production: mount a read-only bearer token file and enable:
    # authorization:
    #   type: Bearer
    #   credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets:
          - host.docker.internal:8000
