# ==============================================================================
# VForge Control Plane — Portainer Git Repository Stack (VM-1: 192.168.1.110)
# Deploy directly from Portainer UI -> Stacks -> Add stack -> Repository:
#   Compose path: docker-compose.portainer-vm1.yml
# ==============================================================================

name: vforge

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42}
    restart: unless-stopped
    environment:
      POSTGRES_DB: vforge
      POSTGRES_USER: vforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VForgePgSuperSecret2026Proxmox1}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vforge -d vforge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-management@sha256:7ddb7fd4630026bc84f72760f33629e8c1ef3bb106360fb385fae0dd4ef886f3}
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: vforge_admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:-VForgeRmqAdminSecret2026Proxmox1}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  valkey:
    image: ${VALKEY_IMAGE:-valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b}
    restart: unless-stopped
    environment:
      VALKEY_ADMIN_PASSWORD: ${VALKEY_ADMIN_PASSWORD:-VForgeVkAdminSecret2026Proxmox1}
      VALKEY_HEALTH_PASSWORD: ${VALKEY_HEALTH_PASSWORD:-VForgeVkHealthSecret2026Proxmox1}
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:-VForgeVkAppSecret2026Proxmox1}
    command:
      - "sh"
      - "-c"
      - |
        ADM_HASH=$$(printf '%s' "$${VALKEY_ADMIN_PASSWORD}" | sha256sum | awk '{print $$1}')
        HLT_HASH=$$(printf '%s' "$${VALKEY_HEALTH_PASSWORD}" | sha256sum | awk '{print $$1}')
        APP_HASH=$$(printf '%s' "$${VALKEY_APP_PASSWORD}" | sha256sum | awk '{print $$1}')
        cat > /tmp/users.acl <<EOF
        user default off
        user vforge_admin on #$${ADM_HASH} ~* &* +@all
        user vforge_health on #$${HLT_HASH} resetkeys -@all +ping +client|setinfo +quit
        user vforge_app on #$${APP_HASH} ~vf:* ~vforge:* resetchannels -@all +ping +select +hello +client|setinfo +quit +incr +incrby +expire +ttl +get +set +del
        EOF
        exec valkey-server --appendonly yes --aclfile /tmp/users.acl
    volumes:
      - valkey_data:/data
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${VALKEY_HEALTH_PASSWORD}\" valkey-cli --user vforge_health ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  control-plane-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: build
    user: "0:0"
    command: ["python", "/opt/portainer-init/init_control_plane.py"]
    restart: "no"
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      VM1_IP: ${VM1_IP:-192.168.1.110}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VForgePgSuperSecret2026Proxmox1}
      POSTGRES_MIGRATOR_USER: vforge_migrator
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-VForgePgMigratorSecret2026Proxmox1}
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-VForgePgAppSecret2026Proxmox1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_VHOST: vforge
      RABBITMQ_ADMIN_USER: vforge_admin
      RABBITMQ_ADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:-VForgeRmqAdminSecret2026Proxmox1}
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:-VForgeRmqAppSecret2026Proxmox1}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://192.168.1.110:8080/realms/vforge}
      RUNNER_MTLS_SEED_SECRET: ${RUNNER_MTLS_SEED_SECRET:-vforge-proxmox-mtls-seed-v1}
    volumes:
      - opa_policies:/run/opa-policies
      - keycloak_import:/run/keycloak-import
      - runner_gateway_certs:/run/runner-gateway
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - control

  opa:
    image: ${OPA_IMAGE:-openpolicyagent/opa:1.22.3@sha256:c1632ced2b6726a257a075523ce4d86258b721b5512e05ee3344ae26148e9031}
    user: "1000:1000"
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - opa_policies:/policies:ro
    depends_on:
      control-plane-init:
        condition: service_completed_successfully
    networks:
      - control
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192M
          pids: 64

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.0@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd}
    command:
      [
        "start-dev",
        "--import-realm",
        "--http-enabled=true",
        "--hostname-strict=false",
        "--proxy-headers=xforwarded",
      ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-vforge-dev-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-VForgeKcAdminSecret2026Proxmox1}
      KC_HOSTNAME: ${KC_PUBLIC_URL:-http://192.168.1.110:8080}
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - keycloak_import:/opt/keycloak/data/import:ro
    depends_on:
      control-plane-init:
        condition: service_completed_successfully
    networks:
      - edge
      - idp
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: build
    command: ["uvicorn", "vforge.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-VForgePgAppSecret2026Proxmox1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: vforge
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:-VForgeRmqAppSecret2026Proxmox1}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_DB: "0"
      VALKEY_APP_USER: vforge_app
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:-VForgeVkAppSecret2026Proxmox1}
      OPA_URL: http://opa:8181
      ARTIFACT_ROOT: /var/lib/vforge/artifacts
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://192.168.1.110:8080/realms/vforge}
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080/realms/vforge
      OIDC_CLIENT_ID: vforge-api
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://192.168.1.110:3000/api/v1/auth/oidc/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://192.168.1.110:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://192.168.1.110:3000","http://localhost:3000"]}
      SCOPE_SIGNING_KEY_ID: ${SCOPE_SIGNING_KEY_ID:-vf-scope-dev-1}
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - artifacts:/var/lib/vforge/artifacts
    depends_on:
      control-plane-init:
        condition: service_completed_successfully
      opa:
        condition: service_started
    networks:
      - edge
      - control
      - idp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./apps/web
    pull_policy: build
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://192.168.1.110:8000}
      INTERNAL_API_BASE_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: build
    command: ["python", "-m", "vforge.orchestration.worker"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-VForgePgAppSecret2026Proxmox1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: vforge
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:-VForgeRmqAppSecret2026Proxmox1}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_DB: "0"
      VALKEY_APP_USER: vforge_app
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:-VForgeVkAppSecret2026Proxmox1}
      OPA_URL: http://opa:8181
      SCOPE_SIGNING_KEY_ID: ${SCOPE_SIGNING_KEY_ID:-vf-scope-dev-1}
    depends_on:
      control-plane-init:
        condition: service_completed_successfully
      opa:
        condition: service_started
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 128

  update-controller:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: build
    command: ["python", "-m", "vforge.lifecycle.update_controller", "--interval", "300"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-VForgePgAppSecret2026Proxmox1}
    depends_on:
      control-plane-init:
        condition: service_completed_successfully
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 192M
          pids: 64

  runner-gateway:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    pull_policy: build
    command: ["python", "-m", "vforge.runner_gateway"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-VForgePgAppSecret2026Proxmox1}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_VHOST: vforge
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:-VForgeRmqAppSecret2026Proxmox1}
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_DB: "0"
      VALKEY_APP_USER: vforge_app
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:-VForgeVkAppSecret2026Proxmox1}
      OPA_URL: http://opa:8181
      ARTIFACT_ROOT: /var/lib/vforge/artifacts
      RUNNER_MTLS_CA_CERT_PATH: /run/runner-gateway/ca.crt
      RUNNER_GATEWAY_CERT_PATH: /run/runner-gateway/gateway.crt
      RUNNER_GATEWAY_KEY_PATH: /run/runner-gateway/gateway.key
    ports:
      - "0.0.0.0:8443:8443"
    volumes:
      - artifacts:/var/lib/vforge/artifacts
      - runner_gateway_certs:/run/runner-gateway:ro
    depends_on:
      control-plane-init:
        condition: service_completed_successfully
    networks:
      - control
      - runner_control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 128

networks:
  edge:
    driver: bridge
  idp:
    driver: bridge
  runner_control:
    driver: bridge
  control:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  rabbitmq_data:
  valkey_data:
  artifacts:
  opa_policies:
  keycloak_import:
  runner_gateway_certs:
