name: vforge

services:
  frontend:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      INTERNAL_API_BASE_URL: http://api:8000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["uvicorn", "vforge.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: vforge
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:?set RABBITMQ_APP_PASSWORD}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_DB: ${VALKEY_DB:-0}
      VALKEY_APP_USER: vforge_app
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:?set VALKEY_APP_PASSWORD}
      OPA_URL: http://opa:8181
      ARTIFACT_ROOT: /var/lib/vforge/artifacts
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: http://127.0.0.1:8080/realms/vforge
      OIDC_INTERNAL_BASE_URL: http://keycloak:8080/realms/vforge
      OIDC_CLIENT_ID: vforge-api
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://127.0.0.1:3000/api/v1/auth/oidc/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:3000","http://localhost:3000"]}
      SCOPE_SIGNING_KEY_ID: ${SCOPE_SIGNING_KEY_ID:-vf-scope-dev-1}
      SCOPE_SIGNING_PRIVATE_KEY_PATH: ${SCOPE_SIGNING_PRIVATE_KEY_PATH:-}
      OPENBAO_ADDR: ${OPENBAO_ADDR:-}
      OPENBAO_NAMESPACE: ${OPENBAO_NAMESPACE:-}
      OPENBAO_AUTH_METHOD: ${OPENBAO_AUTH_METHOD:-approle}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID_FILE: ${OPENBAO_SECRET_ID_FILE:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/var/lib/vforge/artifacts
      - ./infrastructure/lab:/opt/infrastructure/lab:ro
      - ./infrastructure/redteam:/opt/infrastructure/redteam:ro
      - ./lifecycle/image-lock:/opt/lifecycle/image-lock:ro
      - ./docker-compose.yml:/opt/infrastructure/docker-compose.yml:ro
      - ./runner/docker-compose.runner.yml:/opt/infrastructure/docker-compose.runner.yml:ro
      - ./policies:/opt/policies:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opa:
        condition: service_started
    networks:
      - edge
      - control
      - idp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "vforge.orchestration.worker"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: vforge
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:?set RABBITMQ_APP_PASSWORD}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_DB: ${VALKEY_DB:-0}
      VALKEY_APP_USER: vforge_app
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:?set VALKEY_APP_PASSWORD}
      OPA_URL: http://opa:8181
      SCOPE_SIGNING_KEY_ID: ${SCOPE_SIGNING_KEY_ID:-vf-scope-dev-1}
      SCOPE_SIGNING_PRIVATE_KEY_PATH: ${SCOPE_SIGNING_PRIVATE_KEY_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      opa:
        condition: service_started
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128

  update-controller:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "vforge.lifecycle.update_controller", "--interval", "300"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
    volumes:
      - ./lifecycle/image-lock:/opt/lifecycle/image-lock:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 64

  # Dedicated one-shot migration & privileged DB verification runner (never runs as API runtime)
  migrator:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "current"]
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: vforge
      POSTGRES_MIGRATOR_USER: vforge_migrator
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      OPA_URL: http://opa:8181
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128

  postgres:
    image: ${POSTGRES_IMAGE:?set pinned POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: vforge
      POSTGRES_USER: vforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vforge -d vforge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?set pinned RABBITMQ_IMAGE}
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
      RABBITMQ_DEFAULT_USER: vforge_admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD}
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:?set RABBITMQ_APP_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  valkey:
    image: ${VALKEY_IMAGE:?set pinned VALKEY_IMAGE}
    restart: unless-stopped
    environment:
      VALKEY_HEALTH_PASSWORD: ${VALKEY_HEALTH_PASSWORD:?set VALKEY_HEALTH_PASSWORD}
    command:
      [
        "sh",
        "-c",
        "sed 's/vforge_/vforge_/g' /etc/valkey/users.acl > /tmp/users.acl && exec valkey-server --appendonly yes --aclfile /tmp/users.acl",
      ]
    volumes:
      - valkey_data:/data
      - ./.secrets/valkey:/etc/valkey:ro
    networks:
      - control
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${VALKEY_HEALTH_PASSWORD}\" valkey-cli --user vforge_health ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  opa:
    image: ${OPA_IMAGE:?set pinned OPA_IMAGE}
    user: "1000:1000"
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies/rego:/policies:ro
    networks:
      - control
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 64

  # Local development OIDC Identity Provider (opt-in via `--profile dev-oidc`).
  # Isolated from the `control` database/broker network; never use `start-dev` in production.
  keycloak:
    profiles: ["dev-oidc"]
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.4.0@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd}
    command: ["start-dev", "--import-realm", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-vforge-dev-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    networks:
      - edge
      - idp
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Dedicated TLS 1.3 mTLS Runner Gateway (opt-in via `--profile runner`).
  # Connects strictly to `vforge_app` DB and `artifacts`; NEVER mounts docker.sock.
  runner-gateway:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "vforge.runner_gateway"]
    restart: unless-stopped
    environment:
      VFORGE_ENV: ${VFORGE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-local_dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: vforge
      POSTGRES_APP_USER: vforge_app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_VHOST: vforge
      RABBITMQ_APP_USER: vforge_app
      RABBITMQ_APP_PASSWORD: ${RABBITMQ_APP_PASSWORD:?set RABBITMQ_APP_PASSWORD}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_DB: ${VALKEY_DB:-0}
      VALKEY_APP_USER: vforge_app
      VALKEY_APP_PASSWORD: ${VALKEY_APP_PASSWORD:?set VALKEY_APP_PASSWORD}
      OPA_URL: http://opa:8181
      ARTIFACT_ROOT: /var/lib/vforge/artifacts
      RUNNER_MTLS_CA_CERT_PATH: /run/runner-gateway/ca.crt
      RUNNER_GATEWAY_CERT_PATH: /run/runner-gateway/gateway.crt
      RUNNER_GATEWAY_KEY_PATH: /run/runner-gateway/gateway.key
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - artifacts:/var/lib/vforge/artifacts
      - ./infrastructure/lab:/opt/infrastructure/lab:ro
      - ./infrastructure/redteam:/opt/infrastructure/redteam:ro
      - ./lifecycle/image-lock:/opt/lifecycle/image-lock:ro
      - ./docker-compose.yml:/opt/infrastructure/docker-compose.yml:ro
      - ./runner/docker-compose.runner.yml:/opt/infrastructure/docker-compose.runner.yml:ro
      - ./policies:/opt/policies:ro
      - ./.secrets/runner-gateway:/run/runner-gateway:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - control
      - runner_control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128

networks:
  edge:
    driver: bridge
  idp:
    driver: bridge
  runner_control:
    driver: bridge
  control:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  rabbitmq_data:
  valkey_data:
  artifacts:
