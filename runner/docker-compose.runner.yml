# DEVELOPMENT-ONLY dedicated Runner Agent overlay.
# SECURITY INVARIANT: Only the isolated `vforge-runner` execution-plane agent receives
# `/var/run/docker.sock`. Control-plane services (`api`, `orchestrator`, `frontend`,
# `postgres`, `rabbitmq`, `valkey`, `opa`) NEVER mount docker.sock and runner NEVER receives
# database, RabbitMQ, Valkey, signing, or OpenBao credentials.
# In production, deploy the Runner Agent on a separate Linux host/VM over TLS 1.3 mTLS.

services:
  vforge-runner:
    profiles: ["runner"]
    build:
      context: ..
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    environment:
      RUNNER_GATEWAY_URL: https://runner-gateway:8443
      RUNNER_CA_CERT_PATH: /run/runner-certs/ca.crt
      RUNNER_CLIENT_CERT_PATH: /run/runner-certs/runner.crt
      RUNNER_CLIENT_KEY_PATH: /run/runner-certs/runner.key
      RUNNER_SECCOMP_PROFILE: /opt/runner/network-policy/seccomp-scanner.json
      RUNNER_ALLOWED_IMAGE_DIGESTS: ${RUNNER_ALLOWED_IMAGE_DIGESTS:-}
      RUNNER_ORGANIZATION_ID: ${RUNNER_ORGANIZATION_ID:-}
      RUNNER_POOL_ID: ${RUNNER_POOL_ID:-}
      RUNNER_EGRESS_NETWORK: vforge_runner_egress
      RUNNER_EGRESS_BIND_HOST: 0.0.0.0
      RUNNER_GRYPE_DB_SOURCE: ${RUNNER_GRYPE_DB_SOURCE:-vforge_grype_db}
      RUNNER_CHECKOV_CUSTOM_POLICIES_DIR: ${RUNNER_CHECKOV_CUSTOM_POLICIES_DIR:-/opt/runner/checkov-policies}
      RUNNER_NUCLEI_TEMPLATES_DIR: ${RUNNER_NUCLEI_TEMPLATES_DIR:-/opt/runner/nuclei-templates}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.secrets/runner-agent:/run/runner-certs:ro
      - ../runner/images/nuclei/templates:/opt/runner/nuclei-templates:ro
      - runner_scratch:/opt/runner/work
    networks:
      - runner_control
      - runner_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128

networks:
  runner_control:
    driver: bridge
  runner_egress:
    driver: bridge

volumes:
  runner_scratch:
